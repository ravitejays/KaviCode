[project]
name = "kavi"
version = "0.1.0"
description = "Kavi Code - a production-grade terminal AI coding agent. Created by Bahumukh AI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Bahumukh AI" }]
keywords = ["ai", "agent", "coding-assistant", "textual", "tui", "llm"]

dependencies = [
    "textual>=0.80.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "anthropic>=0.39.0",
    "openai>=1.40.0",
    "httpx>=0.27.0",
    "mcp>=1.2.0",
    "platformdirs>=4.2.0",
    "pathspec>=0.12.0",
    "tomli-w>=1.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
    # Web-search fallback backend (used by the WebSearch tool). Bundled by
    # default so Kavi works out of the box on every platform.
    "ddgs>=6.0.0",
    "playwright>=1.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]
# Kept for backwards compatibility; the web-search backend now ships in the
# core dependency set above, so this extra is a no-op alias.
web = [
    "ddgs>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/bahumukh-ai/kavi"
Repository = "https://github.com/bahumukh-ai/kavi"

[project.scripts]
kavi = "kavi.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kavi"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
